services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    user: 1000:1000
    ports:
      - "${LAN_IP}:8096:8096/tcp"
      - "${TAILSCALE_IP}:8096:8096/tcp"
      - "${LAN_IP}:7359:7359/udp"
    volumes:
      - /home/jellyfin/Docker/jellyfin/config:/config
      - /home/jellyfin/Docker/jellyfin/cache:/cache
      - type: bind
        source: /home/jellyfin/Data/media
        target: /media
        read_only: true
      - type: bind
        source: /home/jellyfin/Data/media/discover
        target: /media/discover
    restart: 'unless-stopped'

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/Chicago
    volumes:
      - /home/jellyfin/Docker/sonarr/config:/config
      - /home/jellyfin/Data:/data
    ports:
      - "${LAN_IP}:8989:8989"
    restart: 'unless-stopped'

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/Chicago
    volumes:
      - /home/jellyfin/Docker/radarr/config:/config
      - /home/jellyfin/Data:/data
    ports:
      - "${LAN_IP}:7878:7878"
    restart: 'unless-stopped'

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/Chicago
      WEBUI_PORT: 8080
      TORRENTING_PORT: 6881
    volumes:
      - /home/jellyfin/Docker/qbittorrent/config:/config
      - /home/jellyfin/Data:/data
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    stop_grace_period: "10s"
    restart: 'unless-stopped'

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/Chicago
    volumes:
      - /home/jellyfin/Docker/prowlarr/config:/config
    ports:
      - "${LAN_IP}:9696:9696"
    restart: 'unless-stopped'

  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER}
      VPN_TYPE: ${VPN_TYPE}
      WIREGUARD_PRIVATE_KEY: ${PRIVATE_KEY}
      SERVER_COUNTRIES: ${SERVER_COUNTRIES}
      FIREWALL_INPUT_PORTS: 8080
    ports:
      - "${LAN_IP}:8080:8080/tcp"
    healthcheck:
      test: 'ping -c 1 www.google.com || exit 1'
      interval: '20s'
      timeout: '10s'
      retries: 5
    restart: 'unless-stopped'

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    environment:
      TZ: America/Chicago
    volumes:
      - /home/jellyfin/Docker/seerr/config:/app/config
    ports:
      - "${LAN_IP}:5055:5055"
    restart: 'unless-stopped'

